<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>葱油肉丁炸酱</title>
  <meta name="description" content="葱油肉丁炸酱 产品详情页" />
  <style>
    :root{
      --bg-side: #2f2f2f;
      --overlay: rgba(120, 120, 120, 0.22);
      --card-bg: rgb(255, 252, 237);
      --card-border: rgb(67, 44, 21);
      --text-main: rgb(67, 44, 21);
    }

    *{
      box-sizing: border-box;
    }

    html, body{
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-side);
      overflow: hidden;
      color: var(--text-main);
    }

    body{
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 整个页面始终保持竖向比例 */
    .portrait-stage{
      position: relative;
      height: 100vh;
      aspect-ratio: 2 / 3;
      max-width: 100vw;
      max-height: 100vh;
      background: var(--bg-side);
      overflow: hidden;
    }

    @media (max-aspect-ratio: 2/3){
      .portrait-stage{
        width: 100vw;
        height: auto;
        aspect-ratio: 2 / 3;
      }
    }

    .background{
      position: absolute;
      inset: 0;
      background-image: url("./Background_Image.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
    }

    .background::after{
      content: "";
      position: absolute;
      inset: 0;
      background: var(--overlay);
    }

    .content{
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 7vh 4vw 15vh;
    }

    .card{
  width: 100%;
  background: rgba(255, 252, 237, 0.8);   /* 20%透明 */
  border-radius: 28px;
  padding: 16px;

  /* 右下方向阴影 */
  box-shadow:
    12px 12px 30px rgba(0,0,0,0.35),
    0 6px 12px rgba(0,0,0,0.18);
}

    .card-inner{
      border: 1.8px solid var(--card-border);
      border-radius: 22px;
      padding: 20px 18px 22px;
    }

    .title{
      margin: 0 0 20px;
      font-family:
        "STLiti",
        "华文隶书",
        "LiSu",
        serif;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.15;
      font-weight: 400;
      text-align: center;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    .section{
      margin-top: 18px;
      text-align: left;
    }

    .section:first-of-type{
      margin-top: 0;
    }

    .label{
      margin: 0 0 8px;
      font-family:
        "SimHei",
        "黑体",
        "Microsoft YaHei",
        sans-serif;
      font-size: clamp(17px, 2.8vw, 23px);
      line-height: 1.45;
      font-weight: 700;
      text-align: left;
    }

    .value{
      margin: 0;
      font-family:
        "STKaiti",
        "华文楷体",
        "KaiTi",
        "楷体",
        serif;
      font-size: clamp(15px, 2.45vw, 20px);
      line-height: 1.8;
      font-weight: 400;
      text-align: left;
      white-space: normal;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .logo-wrap{
  position: absolute;
  left: 50%;
  bottom: 3.8vh;
  transform: translateX(-50%);
  z-index: 3;

  display: flex;
  justify-content: center;
  align-items: center;

  width: min(42vw, 220px);
  max-width: 42%;

  /* 删除背景 */
  background: transparent;
}

    .logo{
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    @media (min-width: 900px){
      .card{
        width: calc(100% - 24px);
      }
    }
  </style>
</head>
<body>
  <main class="portrait-stage">
    <div class="background" aria-hidden="true"></div>

    <section class="content">
      <div class="card">
        <div class="card-inner">
          <h1 class="title">葱油肉丁炸酱</h1>

          <div class="section">
            <p class="label">配料表：</p>
            <p class="value">猪五花、干黄酱、黄豆酱、豆瓣酱、黄酒、植物油、京葱、生姜、八角、桂皮</p>
          </div>

          <div class="section">
            <p class="label">储存方式：</p>
            <p class="value">2℃~6℃冷藏，30天</p>
          </div>

          <div class="section">
            <p class="label">食用方法：</p>
            <p class="value">开盖即食。翻热至75℃/165℉以上更佳。</p>
          </div>
        </div>
      </div>
    </section>

    <div class="logo-wrap">
      <img class="logo" src="./Logo.png" alt="LEO Zhang Logo" />
    </div>
  </main>
</body>
</html>
